trigger:
  batch: true
  branches:
    include:
      - main

pr: none # GitHub: CI de esta práctica solo tras cambios en main.

variables:
  azureServiceConnection: sc-animal-rescue-azure
  webAppName: animal-rescue-dockerducks
  appUrl: >-
    https://animal-rescue-dockerducks-g0a8a8fteycfc7hc.westus-01.azurewebsites.net

pool:
  vmImage: windows-latest

stages:
  - stage: CI
    jobs:
      - job: BuildTestPackage
        steps:
          - checkout: self
          - task: UseDotNet@2
            inputs:
              packageType: sdk
              version: 8.x
          - task: DotNetCoreCLI@2
            displayName: Restore
            inputs:
              command: restore
              projects: DockerDucks.sln
          - task: DotNetCoreCLI@2
            displayName: Build Release
            inputs:
              command: build
              projects: DockerDucks.sln
              arguments: --configuration Release --no-restore
          - task: DotNetCoreCLI@2
            displayName: Test Release
            inputs:
              command: test
              projects: tests/DockerDucks.Api.Tests/DockerDucks.Api.Tests.csproj
              arguments: --configuration Release --no-build
              publishTestResults: true
          - task: DotNetCoreCLI@2
            displayName: Publish framework-dependent
            inputs:
              command: publish
              publishWebProjects: false
              projects: src/DockerDucks.Api/DockerDucks.Api.csproj
              arguments: >-
                --configuration Release --no-build --no-restore
                --self-contained false
                --output $(Build.ArtifactStagingDirectory)/publish
              zipAfterPublish: false
              modifyOutputPath: false
          - task: PowerShell@2
            displayName: Validate publish and stamp identity
            inputs:
              targetType: inline
              pwsh: true
              script: |
                $ErrorActionPreference = 'Stop'
                $publish = '$(Build.ArtifactStagingDirectory)/publish'
                $required = @(
                  'DockerDucks.Api.dll', 'web.config', 'wwwroot/index.html'
                )
                foreach ($file in $required) {
                  $path = Join-Path $publish $file
                  if (-not (Test-Path $path -PathType Leaf)) {
                    throw "Missing published file: $file"
                  }
                }
                $wwwroot = Join-Path $publish 'wwwroot'
                if (-not (Test-Path $wwwroot -PathType Container)) {
                  throw 'Missing wwwroot'
                }
                $identity = @{
                  sha = $env:BUILD_SOURCEVERSION
                  buildId = $env:BUILD_BUILDID
                }
                $infoPath = Join-Path $wwwroot 'build-info.json'
                $identity | ConvertTo-Json |
                  Set-Content $infoPath -Encoding utf8
          - task: ArchiveFiles@2
            inputs:
              rootFolderOrFile: $(Build.ArtifactStagingDirectory)/publish
              includeRootFolder: false
              archiveType: zip
              archiveFile: >-
                $(Build.ArtifactStagingDirectory)/package/animal-rescue.zip
              replaceExistingArchive: true
          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)/package
              artifact: animal-rescue-web
              publishLocation: pipeline

  - stage: CD
    dependsOn: CI
    condition: >-
      and(succeeded(),
      eq(variables['Build.SourceBranch'], 'refs/heads/main'),
      ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - deployment: DeployWeb
        environment: animal-rescue-azure
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: none
                - download: none
                - task: DownloadPipelineArtifact@2
                  inputs:
                    buildType: current
                    artifactName: animal-rescue-web
                    targetPath: $(Pipeline.Workspace)/animal-rescue-web
                - task: AzureWebApp@1
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    appType: webApp
                    appName: $(webAppName)
                    package: >-
                      $(Pipeline.Workspace)/animal-rescue-web/animal-rescue.zip
                    deploymentMethod: zipDeploy
                - task: PowerShell@2
                  displayName: Smoke health, UI and exact build identity
                  inputs:
                    targetType: inline
                    pwsh: true
                    script: |
                      $ErrorActionPreference = 'Stop'
                      $base = '$(appUrl)'.TrimEnd('/')
                      for ($attempt = 1; $attempt -le 12; $attempt++) {
                        try {
                          $request = @{ TimeoutSec = 15 }
                          $health = Invoke-WebRequest "$base/health" @request
                          $homeResponse = Invoke-WebRequest "$base/" @request
                          $url = "$base/build-info.json?run=$env:BUILD_BUILDID"
                          $info = Invoke-WebRequest $url @request
                          if ($health.StatusCode -ne 200 -or
                              $health.Content.Trim() -ne 'Healthy') {
                            throw 'Health check failed'
                          }
                          if ($homeResponse.StatusCode -ne 200 -or
                              $homeResponse.Content -notmatch '<html') {
                            throw 'Home check failed'
                          }
                          $identity = $info.Content | ConvertFrom-Json
                          $sha = $env:BUILD_SOURCEVERSION
                          $buildId = $env:BUILD_BUILDID
                          if ($info.StatusCode -ne 200 -or
                              $identity.sha -cne $sha -or
                              [string]$identity.buildId -cne $buildId) {
                            throw 'Deployed SHA/BuildId does not match this run'
                          }
                          Write-Host "Smoke passed: SHA=$sha BuildId=$buildId"
                          break
                        } catch {
                          if ($attempt -eq 12) { throw }
                          Write-Warning "Attempt $attempt failed; retry in 10s"
                          Start-Sleep -Seconds 10
                        }
                      }
